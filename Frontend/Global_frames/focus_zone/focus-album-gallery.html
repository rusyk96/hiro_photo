<main class="container">
  
  <!-- Хлебные крошки -->
  <section class="focus-zone">
    <nav class="breadcrumbs" aria-label="Хлебные крошки">
      <a href="#" class="crumb-link" id="crumb-main-link">Главная</a>
      <span class="crumb-separator">/</span>
      <!-- Динамическое название альбома -->
      <span class="crumb-current" id="crumb-album-title">Загрузка...</span>
    </nav>

    <!-- Контейнер: JS сам заполнит его Bento-карточками фотографий -->
    <div class="grid gallery-grid" id="album-gallery-container"></div>
  </section>

  <!-- Lightbox / Slider Modal -->
  <div id="lightbox" class="lightbox">
    <button class="lightbox-close" id="lightbox-close" aria-label="Close">&times;</button>
    <button class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="Previous">&lsaquo;</button>
    <button class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="Next">&rsaquo;</button>
    
    <div class="lightbox-content">
      <!-- 📸 Карточка-Полароид с паспарту -->
      <div class="polaroid-card" id="polaroid-card">
        <div class="polaroid-frame">
          <img id="lightbox-img" src="" alt="Photo preview" />
        </div>
        
        <!-- Нижнее широкое поле полароида -->
        <div class="polaroid-caption" id="polaroid-caption">
          <span id="polaroid-counter" class="caption-counter">#01 / 01</span>
          <!-- Динамическая подпись полароида (из polaroid.caption в JSON) -->
          <h3 id="polaroid-title" class="caption-title"></h3>
          <div class="caption-logo-wrap">
            <img src="./assets/img/logo/base_logo.svg" alt="Logo" class="caption-logo" />
          </div>
        </div>
      </div>
    </div>
  </div>

</main>
