<!DOCTYPE html>

<head>

  <title>Portfolio | Home</title>

  <!-- Критические стили: контент скрыт до класса .ready, лоадер виден сразу -->
  <style>
  /* 1. Жесткий сброс геометрии, чтобы ничего не съезжало */
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    width: 100%;
    height: 100%;
    background-color: #EDE7E4;
    overflow-x: hidden;
  }

  /* 2. Контент страницы скрыт до полной готовности */
  #header-slot, #focus-slot, #footer-slot {
    opacity: 0;
    transition: opacity 0.25s ease-in-out;
  }

  body.ready #header-slot,
  body.ready #focus-slot,
  body.ready #footer-slot {
    opacity: 1;
  }

  /* 3. Автономный оверлей лоадера строго по границам Viewport */
  .loader {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-color: #EDE7E4;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 999999;
    opacity: 1;
    visibility: visible;
  }

  .loader.is-hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), 
                visibility 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }
</style>
