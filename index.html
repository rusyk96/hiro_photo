<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio | Home</title>

<style>
    body {
      opacity: 0;
      transition: opacity 0.2s ease-in-out;
    }
    body.ready {
      opacity: 1;
    }
  </style>

  <!-- Google Analytics (GA4) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-1RX3K5Y0CE"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-1RX3K5Y0CE');
  </script>

  <!-- Favicons -->
  <link rel="shortcut icon" href="/assets/img/favicon/favicon_32x32.png" type="image/x-icon">
  <link rel="icon" type="image/svg+xml" href="/assets/img/favicon/favicon.svg?v=2">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon/favicon_32x32.png?v=2">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/img/favicon/favicon_192x192.png?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/img/favicon/apple-touch-icon.png?v=2">

  <!-- Стили подгружаются динамически через /Frontend/apps/main.js и resolver.js -->
</head>
<body>

  <!-- Точки монтирования (Слоты для компонентов) -->
  <div id="header-slot"></div>
  <div id="focus-slot"></div>
  <div id="footer-slot"></div>

  <!-- Главная точка входа -->
  <script type="module" src="/Frontend/apps/main.js"></script>

  <script src="https://unpkg.com/css-paint-polyfill"></script>

  <script>
    // Подключаем ворклет суперэллипса
    if ('paintWorklet' in CSS) {
      CSS.paintWorklet.addModule('assets/hudini/worklet-superellipse.js')
        .then(() => {
          document.body.classList.add('houdini-ready');
          console.log('✨ Superellipse Paint Worklet loaded!');
        })
        .catch(err => console.error('Houdini Worklet Error:', err));
    }
  </script>

</body>
</html>
